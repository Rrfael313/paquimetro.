
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>🚗 Parquímetro</h1>

        <p>Digite o valor que deseja inserir:</p>

        <form id="formulario">
            <input
                type="number"
                id="valor"
                placeholder="Ex: 1.00"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">Calcular</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
